(function () {
  function enableTrailer3() {
    var src = (typeof MARKER_SOURCES_CONFIG !== 'undefined')
      ? MARKER_SOURCES_CONFIG
      : window.MARKER_SOURCES_CONFIG;
    if (!src || !src.trailer3_markers) return false;
    src.trailer3_markers.enabled = true;
    var mm = window.mapManager && window.mapManager.markerManager;
    if (mm && typeof mm.loadSource === 'function' && !mm.sources.trailer3_markers) {
      mm.loadSource(src.trailer3_markers);
    }
    return true;
  }
  if (enableTrailer3()) return;
  var n = 0;
  var t = setInterval(function () {
    if (enableTrailer3() || ++n > 100) clearInterval(t);
  }, 50);
})();
</script>
<script>
(function () {
    'use strict';

    const SLOT_TOP = '5961457350';
    const HOST_ID = 'panel-top-ad-host';
    const AD_HEIGHT = 90;
    const MAX_TRIES = 60;

    function clientId() {
        return window.AdsenseRuntime?.CLIENT_ID || 'ca-pub-1483703580037210';
    }

    function featureOn() {
        if (typeof window.AdsenseRuntime?.isFeatureEnabled === 'function') {
            return window.AdsenseRuntime.isFeatureEnabled() === true;
        }
        return true;
    }

    function demoOn() {
        return !!window.AdsenseRuntime?.isDemoMode?.();
    }

    function captionText() {
        return (window.t && window.t('footer.adSupportCaption', 'Little support ad')) || 'Little support ad';
    }

    function ensureStyles() {
        if (document.getElementById('adsense-panel-top-override-css')) return;
        const style = document.createElement('style');
        style.id = 'adsense-panel-top-override-css';
        style.textContent = `
            .panel-ad-zone--top-override{margin-top:14px;padding-top:10px;padding-bottom:4px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}
            .panel-ad-zone--top-override[hidden]{display:none!important}
            .panel-ad-zone--top-override .footer-ad-caption{margin:0;display:flex;align-items:center;justify-content:center;gap:6px;font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;letter-spacing:.2px;color:rgba(255,255,255,.5);user-select:none}
            .panel-ad-zone--top-override .footer-ad-host{width:100%;max-height:100px;overflow:hidden}
            .panel-ad-zone--top-override .footer-ad-host[hidden],
            .panel-ad-zone--top-override .footer-ad-host.footer-ad-host--unfilled{display:none!important;max-height:0!important}
            .panel-ad-zone--top-override .footer-ad-slot .adsbygoogle{display:block!important;width:100%!important;height:${AD_HEIGHT}px!important;max-height:${AD_HEIGHT}px!important;overflow:hidden!important}
            .panel-ad-zone--top-override .footer-ad-demo{display:flex;align-items:center;justify-content:center;gap:8px;height:${AD_HEIGHT}px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.55);font:600 11px Montserrat,sans-serif}
        `;
        document.head.appendChild(style);
    }

    function watchUnfilled(ins, host) {
        if (!ins || !host || ins.dataset.adStatusWatch === '1') return;
        ins.dataset.adStatusWatch = '1';
        const sync = () => {
            const status = ins.getAttribute('data-ad-status');
            if (status === 'unfilled') {
                host.hidden = true;
                host.classList.add('footer-ad-host--unfilled');
                host.closest('.panel-ad-zone--top-override')?.setAttribute('hidden', '');
            } else if (status === 'filled') {
                host.hidden = false;
                host.classList.remove('footer-ad-host--unfilled');
                host.closest('.panel-ad-zone--top-override')?.removeAttribute('hidden');
            }
        };
        sync();
        if (typeof MutationObserver === 'function') {
            new MutationObserver(sync).observe(ins, { attributes: true, attributeFilter: ['data-ad-status'] });
            setTimeout(sync, 2500);
            setTimeout(sync, 6000);
        }
    }

    function mountDemo(host) {
        if (host.querySelector('.footer-ad-slot--demo')) return true;
        host.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'footer-ad-slot footer-ad-slot--demo';
        wrap.innerHTML = `<div class="footer-ad-demo"><i class="fas fa-rectangle-ad" aria-hidden="true"></i><span>Ad · Preview</span></div>`;
        host.appendChild(wrap);
        host.hidden = false;
        return true;
    }

    function pushWhenReady(ins, host) {
        const tryPush = () => {
            if (!ins.isConnected) return;
            if (ins.dataset.adsenseFilled === '1') return;
            if (ins.getAttribute('data-adsbygoogle-status') === 'done') {
                ins.dataset.adsenseFilled = '1';
                watchUnfilled(ins, host);
                return;
            }
            try {
                ins.dataset.adsenseFilled = '1';
                (window.adsbygoogle = window.adsbygoogle || []).push({});
                watchUnfilled(ins, host);
            } catch (e) {
                delete ins.dataset.adsenseFilled;
                console.warn('[adsense-panel-top-override] push failed', e);
            }
        };

        if (window.AdsenseRuntime?.whenReady) {
            window.AdsenseRuntime.whenReady().then(() => {
                requestAnimationFrame(() => requestAnimationFrame(tryPush));
            });
            return;
        }
        setTimeout(tryPush, 800);
    }

    function mountLive(host) {
        if (host.querySelector('ins.adsbygoogle[data-ad-slot="' + SLOT_TOP + '"]')) {
            host.hidden = false;
            return true;
        }
        host.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'footer-ad-slot';
        const ins = document.createElement('ins');
        ins.className = 'adsbygoogle';
        ins.style.display = 'block';
        ins.style.width = '100%';
        ins.style.height = AD_HEIGHT + 'px';
        ins.style.maxHeight = AD_HEIGHT + 'px';
        ins.style.overflow = 'hidden';
        ins.setAttribute('data-ad-client', clientId());
        ins.setAttribute('data-ad-slot', SLOT_TOP);
        ins.setAttribute('data-ad-format', 'horizontal');
        ins.setAttribute('data-full-width-responsive', 'false');
        wrap.appendChild(ins);
        host.appendChild(wrap);
        host.hidden = false;
        pushWhenReady(ins, host);
        return true;
    }

    function ensureZone(grid) {
        let zone = document.querySelector('.panel-ad-zone--top-override');
        if (zone) return zone;

        zone = document.createElement('section');
        zone.className = 'panel-ad-zone panel-ad-zone--top-override';
        zone.setAttribute('aria-label', captionText());
        zone.innerHTML = `
            <p class="footer-ad-caption">
                <i class="fas fa-heart" aria-hidden="true"></i>
                <span>${captionText()}</span>
            </p>
            <div class="footer-ad-host" id="${HOST_ID}" hidden></div>
        `;
        grid.insertAdjacentElement('afterend', zone);
        return zone;
    }

    function place(tries) {
        if (document.getElementById(HOST_ID)?.querySelector('.footer-ad-slot')) return;

        const grid = document.querySelector('.rockstar-maps-grid');
        if (!grid) {
            if (tries < MAX_TRIES) setTimeout(() => place(tries + 1), 250);
            return;
        }

        if (!featureOn() && !demoOn()) return;

        ensureStyles();
        const zone = ensureZone(grid);
        const host = zone.querySelector('#' + HOST_ID);
        if (!host) return;

        if (window.AdsenseRuntime?.mountControlPanelTop) {
            const mounted = window.AdsenseRuntime.mountControlPanelTop(host);
            host.hidden = !mounted;
            zone.toggleAttribute('hidden', !mounted);
            return;
        }

        const ok = demoOn() ? mountDemo(host) : mountLive(host);
        zone.toggleAttribute('hidden', !ok);
    }

    function boot() {
        place(0);
        document.addEventListener('siteSettingsChanged', () => {
            const host = document.getElementById(HOST_ID);
            const zone = host?.closest('.panel-ad-zone--top-override');
            if (!featureOn() && !demoOn()) {
                if (host) {
                    host.innerHTML = '';
                    host.hidden = true;
                }
                zone?.setAttribute('hidden', '');
                return;
            }
            place(0);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();

</script>
